<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlit Timeline Editor Pro - JK丸ゴシック版</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- ヘッダー -->
        <div id="header">
            <h1>⭐ Starlit Timeline Editor Pro</h1>
            <div class="button-group">
                <button class="btn btn-primary" onclick="app.importAsset()">📁 素材追加</button>
                <button class="btn btn-secondary" onclick="app.saveProject()">💾 保存</button>
                <button class="btn btn-secondary" onclick="app.loadProject()">📂 読込</button>
                <button class="btn btn-success" onclick="app.exportVideo()">🎬 書き出し</button>
            </div>
        </div>

        <!-- メインワークスペース -->
        <div id="workspace">
            <!-- 左サイドバー: 素材エクスプローラー -->
            <div id="leftSidebar">
                <div class="sidebar-header">📦 素材エクスプローラー</div>
                
                <!-- フィルタータブ -->
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="app.filterAssets('all')">すべて</button>
                    <button class="filter-tab" onclick="app.filterAssets('image')">🖼️ 画像</button>
                    <button class="filter-tab" onclick="app.filterAssets('video')">🎥 動画</button>
                    <button class="filter-tab" onclick="app.filterAssets('audio')">🎵 音声</button>
                    <button class="filter-tab" onclick="app.filterAssets('sequence')">📸 連番</button>
                </div>
                
                <div id="assetList"></div>
            </div>

            <!-- 中央エリア -->
            <div id="centerArea">
                <!-- プレビューエリア -->
                <div id="previewArea">
                    <canvas id="previewCanvas" width="1920" height="1080"></canvas>
                </div>

                <!-- コントロールバー -->
                <div id="controlBar">
                    <button class="control-btn" onclick="app.skipToStart()">⏮️</button>
                    <button class="control-btn" id="playPauseBtn" onclick="app.togglePlayPause()">▶️</button>
                    <button class="control-btn" onclick="app.skipToEnd()">⏭️</button>
                    <div id="timeDisplay">00:00.000</div>
                    <span class="zoom-label">🔍 ズーム:</span>
                    <input type="range" id="timelineZoom" min="10" max="200" value="100" 
                           oninput="app.updateTimelineZoom(this.value)">
                </div>

                <!-- タイムラインエリア -->
                <div id="timelineArea">
                    <div id="timelineContainer">
                        <div id="timelineRuler"></div>
                        <div id="playhead">
                            <div class="playhead-handle"></div>
                        </div>
                        <div id="tracks"></div>
                    </div>
                </div>
            </div>

            <!-- 右サイドバー: プロパティパネル -->
            <div id="rightSidebar">
                <div class="sidebar-header">⚙️ プロパティ</div>
                <div id="propertiesContent">
                    <div class="empty-message">クリップを選択してください</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
